name: security-scan

# Veracode SAST + SCA. Kept out of ci.yml because it runs on a different cadence and,
# unlike the rest of CI, it depends on credentials that live outside the repo.
#
# SECURITY: the trigger is `pull_request`, never `pull_request_target`. This repo is
# public, so anyone can open a PR from a fork. GitHub withholds secrets from fork PRs on
# `pull_request`; `pull_request_target` would run with secrets available to code the fork
# controls, which would hand out the Veracode credentials. Fork PRs therefore show these
# jobs as skipped — that is correct, not a failure.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VERACODE_API_ID   HMAC API ID      -> SAST (pipeline + policy scans)
#   VERACODE_API_KEY  HMAC secret key  -> SAST (pipeline + policy scans)
#   SRCCLR_API_TOKEN  SCA agent token  -> SCA only; optional, that job skips without it
#
# Every job is gated on the relevant secret being present, so merging this cannot break
# CI before the secrets are configured — the jobs report as skipped until then.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full policy scan, Mondays 03:17 UTC. Off-peak and off the hour, because
    # scheduled jobs on the hour queue behind everyone else's.
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `secrets` is not available in a job-level `if`, so presence has to be resolved in a
  # step and passed on as an output.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_sast: ${{ steps.check.outputs.has_sast }}
      has_sca: ${{ steps.check.outputs.has_sca }}
    steps:
      - id: check
        env:
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        run: |
          if [ -n "$VERACODE_API_ID" ] && [ -n "$VERACODE_API_KEY" ]; then
            echo 'has_sast=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_sast=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Veracode SAST skipped — VERACODE_API_ID / VERACODE_API_KEY not configured.'
          fi
          if [ -n "$SRCCLR_API_TOKEN" ]; then
            echo 'has_sca=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_sca=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Veracode SCA skipped — SRCCLR_API_TOKEN not configured.'
          fi

  # Produces the artifact both scan jobs consume, so packaging happens once per run.
  #
  # Node must be installed BEFORE `veracode package`. Verified against this repo in a
  # Linux container: without Node the CLI logs "npm project detected but npm not
  # available" and silently degrades to a generic JavaScript package; with it, the
  # NpmPackager runs a real build per workspace. It emits four artifacts (root, api,
  # web, shared); the root one contains all 94 source files across every workspace, so
  # scanning that single artifact covers the monorepo.
  package:
    needs: preflight
    if: needs.preflight.outputs.has_sast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # packages/shared builds dual CJS+ESM and the other workspaces import from its
      # dist, so the packager's per-workspace builds fail without it (see CLAUDE.md).
      - name: Build shared package
        run: npm run build -w @itsm/shared

      - name: Install the Veracode CLI
        run: curl -fsS https://tools.veracode.com/veracode-cli/install | sh

      - name: Package application artifacts
        run: ./veracode package --source . --output veracode-artifacts --trust

      # The CLI names each artifact after its source directory basename, which on a
      # runner is the repository name — not something to hardcode in the scan jobs.
      # Normalise the root artifact to a stable filename, and fail loudly listing what
      # was actually produced if it is missing, rather than letting a later job die on
      # a confusing "file not found".
      - name: Normalise the root artifact filename
        run: |
          root_zip="veracode-artifacts/veracode-auto-pack-$(basename "$PWD")-js.zip"
          if [ ! -f "$root_zip" ]; then
            echo "::error::Expected root artifact '$root_zip' was not produced."
            echo 'Artifacts that were produced:'
            ls -la veracode-artifacts
            exit 1
          fi
          mv "$root_zip" veracode-artifacts/veracode-app.zip
          ls -la veracode-artifacts

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: veracode-artifacts
          path: veracode-artifacts/
          retention-days: 5

  # Fast feedback on PRs. Fails only on Very High and High so the gate stays credible —
  # a scanner that blocks on everything gets ignored within a fortnight. Medium and below
  # are reported in the job summary without failing the build.
  sast-pipeline:
    needs: [preflight, package]
    if: needs.preflight.outputs.has_sast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The action posts its scan summary as a PR comment, which is where the findings are
    # actually useful. Without this it logs
    # "HttpError: Resource not accessible by integration" and the summary is buried in
    # the job output. Scoped to this job rather than the workflow, and harmless on fork
    # PRs — GitHub issues those a read-only token regardless of what is requested here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: veracode-artifacts
          path: veracode-artifacts

      - name: Veracode Pipeline Scan
        uses: veracode/Veracode-pipeline-scan-action@v1.0.25
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          file: veracode-artifacts/veracode-app.zip
          # The embedded double quotes are load-bearing. The action appends every input
          # to the CLI command unquoted (only `include` is special-cased), so a bare
          # `Very High, High` word-splits: the Java arg parser takes "Very" as the value
          # and rejects the remainder, aborting the whole scan. Quoting it here keeps it
          # a single argument.
          fail_on_severity: '"Very High, High"'
          fail_build: true
          # `fail_build` alone is not enough: it only trips when the scan *output* matches
          # /FAILURE: Found \d+ issues!/, so a scan that never ran leaves the job green.
          fail_build_error: true
          issue_details: true
          summary_display: true
          project_name: ${{ github.repository }}
          project_url: ${{ github.server_url }}/${{ github.repository }}
          project_ref: ${{ github.ref }}

      # Belt and braces over the action's own failure handling, which is output-regex
      # based and stayed green through a scan that aborted on a malformed argument. A
      # security gate that passes without inspecting anything is worse than no gate, so
      # assert the scan genuinely produced results before letting the job succeed.
      - name: Verify the scan actually ran
        if: always()
        run: |
          if [ ! -s results.json ]; then
            echo '::error::Veracode produced no results.json — the scan did not run. Failing rather than reporting a pass that inspected nothing.'
            exit 1
          fi
          node -e '
            const fs = require("fs");
            let r;
            try {
              r = JSON.parse(fs.readFileSync("results.json", "utf8"));
            } catch (e) {
              console.error("::error::results.json is not valid JSON — the scan did not complete: " + e.message);
              process.exit(1);
            }
            const findings = Array.isArray(r.findings) ? r.findings : null;
            if (!r.scan_id && findings === null) {
              console.error("::error::results.json has neither scan_id nor a findings array — the scan did not complete.");
              process.exit(1);
            }
            console.log("Scan completed. Findings reported: " + (findings ? findings.length : "unknown"));
          '

      # The action only publishes filtered_results.json — the findings that breached the
      # gate. Everything below it (today: one Medium) exists solely in the job log, which
      # ages out. Part XIII requires sub-gate findings to be reviewed rather than
      # accumulate unseen, and a dismissal to carry a written rationale; neither is
      # possible against a file nobody kept. results.json holds the complete set.
      - name: Publish the full findings
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sast-findings
          path: |
            results.json
            filtered_results.json
          retention-days: 30
          if-no-files-found: warn

  # The full policy scan is slow (tens of minutes), so it never runs on a PR — only on
  # main and on the weekly schedule. This is the one that produces the compliance result.
  sast-policy:
    needs: [preflight, package]
    if: >-
      needs.preflight.outputs.has_sast == 'true' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: veracode-artifacts
          path: veracode-artifacts

      - name: Veracode Upload and Scan
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          appname: 'Project_ITSM'
          createprofile: true
          filepath: veracode-artifacts/veracode-app.zip
          version: '${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}'
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          # The app holds credentials and an audit trail, so it is not a low-criticality
          # profile even while it is pre-production.
          criticality: 'High'
          scantimeout: 60

  # Agent-based SCA: a different advisory database from npm's, plus license data and
  # reachability analysis. Runs against the repository source, so it needs no artifact.
  #
  # NOTE: `npm audit` is NOT currently run anywhere in CI. The dependency pass took the
  # tree to zero advisories but nothing enforces that it stays there, so until either
  # this job is configured or an `npm audit` gate is added to ci.yml, a newly introduced
  # vulnerable dependency will merge unnoticed.
  sca:
    needs: preflight
    if: needs.preflight.outputs.has_sca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Veracode SCA
        uses: veracode/veracode-sca@v2.1.20
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Required for an npm-workspaces monorepo. Without it the agent reads only the
          # root package.json and reports "Direct Libraries 0 / Total 184" against a tree
          # that actually resolves ~950 packages — it never sees apps/api or apps/web, so
          # a clean result would say nothing about the dependencies that matter.
          recursive: true
          # Findings are reported in the job log rather than opened as GitHub issues.
          # Auto-filing issues on a public repo would publish the vulnerability inventory
          # of a running deployment; revisit once there is a private triage destination.
          create-issues: false
