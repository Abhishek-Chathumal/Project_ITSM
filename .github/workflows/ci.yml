name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @itsm/shared
      # Needed even though nothing lints the generated client itself (eslint ignores
      # `src/generated`). Linting here is type-aware — `parserOptions.project` — and the
      # Prisma 7 client is gitignored, so without this the type information behind every
      # rule that touches a Prisma type silently degrades on a fresh checkout.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check

  # Veracode SCA (security-scan.yml) installs with --omit=dev, so it only ever sees the
  # production tree — 184 libraries against 941 in the full tree when that was measured
  # (PROJECT_STATE.md §4). The vite/vitest/esbuild advisories cleared in the dependency
  # pass lived entirely in the dev-only remainder and would not have been caught. This
  # job is what covers it, and the two are complements rather than substitutes.
  #
  # It needs no `npm ci`: npm resolves advisories from package-lock.json alone.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Runs first and never fails, so the artifact exists even when the gate below is
      # red. A finding that only ever appears in a job log cannot be reviewed later
      # (constitution Part XIII) — the same reasoning as security-scan.yml's
      # `sast-findings`. `npm audit` exits non-zero whenever anything is reported, which
      # is why this step swallows its status; the gate step is what decides the build.
      - name: Collect the full advisory report (every severity)
        run: npm audit --json > npm-audit.json || true
      - name: Publish the report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30
          if-no-files-found: warn
      # Gates on high and above, matching sast-pipeline's threshold. Moderate and below
      # are in the artifact above rather than blocking a PR — a gate that fires on
      # everything stops being read.
      - name: Fail on high and critical advisories
        run: npm audit --audit-level=high

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @itsm/shared
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: itsm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://itsm:change-me@localhost:5432/itsm
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      SESSION_SECRET: ci-test-secret
      SEED_BOOTSTRAP_ADMIN: 'true'
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @itsm/shared
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      # Prisma 7 no longer seeds implicitly as part of `migrate`, and the schema path plus
      # the connection URL both come from the root prisma.config.ts — so this runs from the
      # repo root with no flags rather than from apps/api with --schema.
      - name: Seed database
        run: npx prisma db seed
      - name: API tests
        run: npm run test -w @itsm/api
      - name: Web tests
        run: npm run test -w @itsm/web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @itsm/shared
      - run: npx prisma generate
      - run: npm run build
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t itsm-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t itsm-web:ci .

  # Building an image proves it compiles; it does NOT prove the container runs.
  # This job starts the real stack and exercises it over HTTP, which is what catches
  # runtime-only failures (missing native libs, bad migrations, broken service wiring).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env file
        run: |
          cp .env.example .env
          sed -i 's|^SESSION_SECRET=.*|SESSION_SECRET=ci-smoke-secret-not-for-real-use-and-comfortably-over-the-length-floor|' .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to serve traffic
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "API is healthy (migrations applied and Nest booted)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API never became healthy"
          exit 1
      - name: Verify the session/Redis layer responds
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/v1/auth/csrf
      - name: Verify the frontend is served
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The dev stack is a different animal from prod: Vite dev server instead of nginx,
  # bind-mounted source, hot reload. It's what a contributor actually runs day to day,
  # so it gets its own smoke test — notably covering the dev server's /api proxy, which
  # prod's nginx config does not exercise.
  smoke-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare env file
        run: |
          cp .env.example .env
          sed -i 's|^SESSION_SECRET=.*|SESSION_SECRET=ci-smoke-secret-not-for-real-use-and-comfortably-over-the-length-floor|' .env
      - name: Start the dev stack
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
      - name: Wait for the API to serve traffic
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API never became healthy in the dev stack"
          exit 1
      - name: Wait for the Vite dev server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite dev server is serving"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Vite dev server never came up"
          exit 1
      # The check that matters: hitting the API *through* the dev server's proxy.
      # A wrong proxy target (e.g. localhost inside the web container) fails here
      # while every other check in this workflow still passes.
      - name: Verify the dev server proxies /api to the API container
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/api/v1/auth/csrf)
          echo "proxied /api/v1/auth/csrf -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Vite proxy did not reach the API (got $code)"
            exit 1
          fi
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
